[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for the PM MVP"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "email-validator>=2.2.0",
  "python-dotenv>=1.1.1",
  "pwdlib[argon2]>=0.2.1",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
